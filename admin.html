<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSLM Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { padding: 10px; margin: 10px 0; width: 100%; box-sizing: border-box; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .hidden { display: none; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
        img { max-width: 100%; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>OSLM Admin Dashboard</h1>
        
        <div id="loginScreen">
            <h2>Admin Login</h2>
            <input type="text" id="username" placeholder="Username" value="admin"><br>
            <input type="password" id="password" placeholder="Password" value="password123"><br>
            <button onclick="login()">Login</button>
        </div>

        <div id="dashboard" class="hidden">
            <h2>Welcome, Admin</h2>
            <button onclick="logout()">Logout</button>
            <hr>
            <h3>Upload Pictures</h3>
            <input type="file" id="imageUpload" accept="image/*" multiple>
            <button onclick="uploadImages()">Upload Selected Images</button>
            <hr>
            <h3>Uploaded Images</h3>
            <div id="adminGallery" class="gallery"></div>
        </div>
    </div>

    <script>
        let images = JSON.parse(localStorage.getItem('oslmImages') || '[]');

        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if (user === 'admin' && pass === 'password123') {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadGallery();
            } else {
                alert('Invalid credentials');
            }
        }

        function logout() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        }

        function uploadImages() {
            const files = document.getElementById('imageUpload').files;
            if (files.length === 0) return alert('Please select images');

            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    images.push(e.target.result);
                    localStorage.setItem('oslmImages', JSON.stringify(images));
                    loadGallery();
                };
                reader.readAsDataURL(file);
            }
            document.getElementById('imageUpload').value = '';
        }

        function loadGallery() {
            const gallery = document.getElementById('adminGallery');
            gallery.innerHTML = '';
            images.forEach((imgSrc, index) => {
                const div = document.createElement('div');
                div.innerHTML = `<img src="${imgSrc}">
                    <button onclick="deleteImage(${index})">Delete</button>`;
                gallery.appendChild(div);
            });
        }

        function deleteImage(index) {
            if (confirm('Delete this image?')) {
                images.splice(index, 1);
                localStorage.setItem('oslmImages', JSON.stringify(images));
                loadGallery();
            }
        }

        // Auto login for demo if already logged in
        if (localStorage.getItem('oslmLoggedIn')) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            loadGallery();
        }
    </script>
</body>
</html>
